name: Security Scan & Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    name: Code, Dependency Audit & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pytest

      - name: Run Python static security scan (Bandit)
        run: |
          # Bandit scans for common security vulnerabilities in Python code
          # -r scans recursively, -ll filters to medium/high severity issues
          bandit -r app/ -ll

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          # pip-audit checks dependencies against the PyPI vulnerability database
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest
